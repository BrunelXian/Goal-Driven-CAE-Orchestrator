[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "vericae"
version = "0.5.6"
description = "Read-only consistency checks for file-based CAE research workspaces."
requires-python = ">=3.11,<4"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
vericae = "vericae.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["vericae"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
