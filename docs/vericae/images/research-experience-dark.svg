<svg xmlns="http://www.w3.org/2000/svg" width="920" height="716" viewBox="0 0 920 716" role="img" aria-labelledby="title desc">
<title id="title">VeriCAE research experience — historical axial-bar verification</title>
<desc id="desc">Structured summary of the published INT-001 records: Main dispatches scoped tasks, CAE reviews the reference model, Results reads historical evidence, Independent Validation checks the numerical result and selector attribution. Analytical and DAT displacement agree at minus 0.010 mm; overall evidence remains PARTIAL. No new solver run.</desc>
