<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 458" width="920" height="458" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><title id="title">Four research applications of VeriCAE</title><desc id="desc">Inverse Identification: Plan inverse studies from measured responses, compare simulations with experiments, and refine candidate material parameters. Example: Small-punch material calibration. Simulation-Driven Scientific Discovery: Use CAE as a virtual experimental environment: propose hypotheses, design experiments and search for patterns or counterexamples. Example: Scaling laws &amp; dimensionless analysis. Engineering Design &amp; Process Optimization: Explore designs and manufacturing strategies under explicit constraints, compare outcomes and choose the next evidence-led candidate. Example: Laser deposition scan strategy. Mechanism &amp; Sensitivity Investigation: Vary geometry, materials, loads and boundaries to identify dominant factors, coupled effects and potential physical mechanisms. Example: Structural failure or thermal distortion.</desc>
<g transform="translate(1 1)"><rect x="0" y="0" width="454" height="222" rx="12" fill="#0d1117" stroke="#3d444d" stroke-width="1.2"/><rect x="20" y="17" width="35" height="35" rx="8" fill="none" stroke="#3d444d" stroke-width="1.15"/><g transform="translate(25.5 22.5)" fill="none" stroke="#b9c2cf" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h17m-5-5 5 5-5 5M21 17H4m5-5-5 5 5 5"/></g><text x="433" y="40" font-size="13" fill="#a0a8b3" font-weight="500" text-anchor="end">01</text><text x="20" y="84" font-size="19" fill="#e6edf3" font-weight="600" text-anchor="start">Inverse Identification</text><text x="20" y="121" font-size="15" fill="#a0a8b3" font-weight="400" text-anchor="start">Plan inverse studies from measured responses,</text><text x="20" y="140" font-size="15" fill="#a0a8b3" font-weight="400" text-anchor="start">compare simulations with experiments, and</text><text x="20" y="159" font-size="15" fill="#a0a8b3" font-weight="400" text-anchor="start">refine candidate material parameters.</text><path d="M20 178 H434" stroke="#30363d" stroke-width="1"/><text x="20" y="200" font-size="10.5" fill="#a0a8b3" font-weight="600" text-anchor="start">EXAMPLE</text><text x="86" y="200" font-size="13.2" fill="#e6edf3" font-weight="500" text-anchor="start">Small-punch material calibration</text></g>
