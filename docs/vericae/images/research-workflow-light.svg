<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 794" width="920" height="794" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<title id="title">VeriCAE research workflow and two-layer architecture</title><desc id="desc">A researcher defines a goal. VeriCAE Main coordinates CAE, Results and Independent Validation in Codex Native conversations and maintains research records. AbqJobPilot is the separate Windows execution layer reached through scoped MCP requests and evidence queries, with independent execution approval. Findings inform the next scientific decision. This is a conceptual workflow.</desc>
