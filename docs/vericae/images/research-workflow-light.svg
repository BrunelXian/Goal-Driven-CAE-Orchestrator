<text x="460" y="77" font-size="19" font-weight="500" fill="#1f2328" text-anchor="middle">Verifiable, Goal-Driven CAE Research Agent</text>
<text x="460" y="101" font-size="15" font-weight="400" fill="#59636e" text-anchor="middle">From research questions to evidence-based engineering decisions.</text>
